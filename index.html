<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/scrip.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritmo - Reconhecedor de Melodias</title>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="title-wrapper">
                <h1 id="appTitle">Ritmo</h1>
                <span class="music-emoji">🎵</span>
            </div>
            <p>Cantarole, assobie ou batuque o ritmo. A gente descobre a música.</p>
        </header>

        <div class="search-container" id="searchContainer">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <button class="mic-btn" id="micBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
        </div>

        <div class="status-text" id="statusText">Toque no botão para começar</div>

        <div class="result-card" id="resultCard">
            <div class="track-info">
                <div class="album-cover" id="albumCover"></div>
                <div class="track-details">
                    <h3 id="trackTitle">Nome da Música</h3>
                    <p id="trackArtist">Artista / Banda</p>
                    <p id="trackAlbum" style="font-size: 0.8rem; margin-top: 4px; color: var(--text-muted);">Álbum (Ano)</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
